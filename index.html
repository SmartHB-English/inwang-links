<head>

<meta property="og:title" content="홍제인왕스마트해법수학영어학원">
<meta property="og:description" content="상담 신청 · 인왕보카 앱 · 블로그 · 인스타그램 · 카카오톡 채널">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f3f5f9;
    --card: #ffffff;
    --text: #1c2230;
    --sub: #6b7280;
    --line: #e5e7eb;
    --accent: #1f4e8c;
    --navy: #173e72;
    --accent-soft: #e8eef7;
    --sky: #8fb6ec;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 상단 포스터 ── */
  .hero {
    position: relative;
    overflow: hidden;
    background: linear-gradient(160deg, #0f2d57 0%, var(--navy) 45%, #2a64b0 100%);
    color: #fff;
    text-align: center;
    padding: 64px 24px 92px;
    border-radius: 0 0 36px 36px;
  }
  .hero .shape { position: absolute; border-radius: 50%; pointer-events: none; }
  .hero .s1 { width: 260px; height: 260px; top: -90px; right: -80px; background: rgba(143,182,236,.18); animation: float 9s ease-in-out infinite; }
  .hero .s2 { width: 140px; height: 140px; bottom: -40px; left: -40px; border: 22px solid rgba(255,255,255,.07); animation: float 11s ease-in-out infinite reverse; }
  .hero .s3 { width: 14px; height: 14px; top: 70px; left: 15%; background: #ffd65a; animation: float 6s ease-in-out infinite; }
  .hero .s4 { width: 8px; height: 8px; top: 160px; right: 16%; background: rgba(255,255,255,.6); animation: float 7s ease-in-out infinite reverse; }
  .hero .grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,.09) 1.2px, transparent 1.2px);
    background-size: 18px 18px;
    mask-image: linear-gradient(to bottom, #000 0%, transparent 85%);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 85%);
  }
  .hero-inner { position: relative; max-width: 420px; margin: 0 auto; }

  .eyebrow {
    display: inline-block;
    font-size: 11px; font-weight: 700; letter-spacing: 3.5px;
    color: var(--sky);
    margin-bottom: 14px;
  }
  h1 { word-break: keep-all; line-height: 1.1; }
  h1 .big {
    display: block;
    font-size: 54px; font-weight: 900; letter-spacing: -1.2px;
  }
  h1 .hl {
    position: relative; display: inline-block; padding: 0 6px;
  }
  h1 .hl::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 7px;
    background: #ffd65a; opacity: .9; z-index: -1; border-radius: 3px;
    transform-origin: left; transform: scaleX(0);
    animation: draw .7s .55s cubic-bezier(.6,0,.2,1) forwards;
  }
  h1 .hl span { position: relative; z-index: 1; }
  h1 .hl { z-index: 0; isolation: isolate; }
  h1 .hl::after { z-index: -1; }
  h1 .hl span { color: #fff; text-shadow: 0 4px 18px rgba(8,25,52,.45); }
  h1 .rest {
    display: block; margin-top: 22px;
    font-size: 20px; font-weight: 800; letter-spacing: -0.6px;
    color: #dbe7f8;
  }
  .chips { margin-top: 18px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-size: 13px; font-weight: 600;
    padding: 6px 12px; border-radius: 999px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.18);
    color: #fff;
    backdrop-filter: blur(4px);
  }

  /* ── 본문 ── */
  main { position: relative; max-width: 420px; margin: -60px auto 0; padding: 0 20px 40px; }

  .app {
    padding: 18px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 12px 32px rgba(15,45,87,.16);
    margin-bottom: 20px;
  }
  .app-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .app-icon {
    flex: none; width: 46px; height: 46px; border-radius: 12px;
    background: linear-gradient(140deg, #2a64b0, var(--navy)); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; letter-spacing: -0.3px;
  }
  .app-name { font-size: 17px; font-weight: 800; letter-spacing: -0.4px; }
  .app-name .new {
    display: inline-block; vertical-align: 2px; margin-left: 6px;
    font-size: 10px; font-weight: 800; letter-spacing: .5px;
    padding: 2px 6px; border-radius: 6px;
    background: #ffd65a; color: #4a3a00;
  }
  .app-desc { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .stores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .store {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 8px;
    background: var(--text); color: #fff;
    border-radius: 12px; text-decoration: none;
    transition: transform .12s ease, opacity .12s ease;
  }
  .store:hover { opacity: .88; }
  .store:active { transform: scale(.97); }
  .store svg { width: 20px; height: 20px; flex: none; }
  .store span { font-size: 15px; font-weight: 700; line-height: 1.15; }
  .store small { display: block; font-size: 10px; font-weight: 500; opacity: .7; }

  .links { display: flex; flex-direction: column; gap: 12px; }
  .link {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    color: var(--text);
    text-decoration: none;
    font-size: 16px; font-weight: 600;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .link:hover { border-color: var(--accent); box-shadow: 0 6px 18px rgba(31,78,140,.10); transform: translateY(-2px); }
  .link:active { transform: scale(.98); }
  .link .icon {
    flex: none; width: 40px; height: 40px; border-radius: 11px;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .link .icon svg { width: 20px; height: 20px; }
  .link .label { flex: 1; }
  .link .label small { display: block; font-size: 13px; font-weight: 400; color: var(--sub); margin-top: 2px; }
  .link .arrow { color: #b8bec8; font-size: 18px; transition: transform .15s ease; }
  .link:hover .arrow { transform: translateX(3px); }

  .link.primary {
    background: linear-gradient(120deg, var(--navy), #2a64b0);
    border: none; color: #fff;
    padding: 18px;
    box-shadow: 0 10px 24px rgba(31,78,140,.28);
  }
  .link.primary .icon { background: #ffd65a; color: var(--navy); }
  .link.primary .label { font-size: 17px; font-weight: 800; }
  .link.primary .label small { color: rgba(255,255,255,.78); }
  .link.primary .arrow { color: #fff; }
  .link.primary::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.28), transparent);
    transform: skewX(-20deg);
    animation: shine 3.2s 1.6s ease-in-out infinite;
  }

  footer { margin-top: 36px; text-align: center; font-size: 12px; color: #9aa1ab; }

  /* ── 등장 애니메이션 ── */
  .rise { opacity: 0; transform: translateY(18px); animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
  .d1 { animation-delay: .05s; } .d2 { animation-delay: .18s; } .d3 { animation-delay: .3s; }
  .d4 { animation-delay: .45s; } .d5 { animation-delay: .55s; } .d6 { animation-delay: .65s; }
  .d7 { animation-delay: .75s; } .d8 { animation-delay: .85s; }

  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes draw { to { transform: scaleX(1); } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  @keyframes shine { 0% { left: -60%; } 45%,100% { left: 130%; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .rise { opacity: 1; transform: none; }
    h1 .hl::after { transform: scaleX(1); }
  }
</style>
</head>
